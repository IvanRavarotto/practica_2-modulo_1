[project]
name = "fastapi-questions"
version = "0.1.0"
description = "API de preguntas con FastAPI y Hugging Face"
authors = [
    {name = "Iván",email = "itravarotto@gmail.com"}
]
requires-python = ">=3.10"
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry.dependencies]
fastapi = "^0.136.1"
uvicorn = "^0.47.0"
sqlalchemy = "^2.0.49"
psycopg2-binary = "^2.9.12"
pandas = "<3"
pyarrow = "^24.0.0"
requests = "^2.34.2"
